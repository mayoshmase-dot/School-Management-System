services:
  app:
    build: .
    container_name: school-app
    ports:
      - "3000:3000"
    environment:
      - DB_NAME=school_db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_HOST=db
      - DB_PORT=3306
      - SALT_ROUND=8
      - SENDER_EMAIL=mayoshmase@gmail.com
      - SENDER_PASSWORD=uljizqchgapkgaiq
      - CONFIRM_EMAIL_SIGNAL=school@1234
      - LOGIN_SIGNAL=student@897899
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mysql:8
    container_name: school-db
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=school_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data: